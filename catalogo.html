<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | DinoAventura Decoraciones</title>
  <meta name="description" content="Paquetes de decoración con precios de referencia.">
  <link rel="icon" href="img/logo-principal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Lilita One: la tipografia mas cercana (y gratuita) al rotulo del logo. Nunito: texto de lectura. -->
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <!-- ENCABEZADO (igual en todas las paginas): rotulo del logo y menu. aria-current marca la pagina actual. -->
  <header class="header">
    <div class="contenedor nav">
      <a href="index.html" class="logo"><img src="img/logo-palabra.png" alt="DinoAventura Decoraciones, inicio" width="157" height="52"></a>
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      <nav id="menu" class="menu">
        <a href="index.html">Inicio</a>
        <a href="nosotros.html">Quiénes somos</a>
        <a href="servicios.html">Servicios</a>
        <a href="catalogo.html" aria-current="page">Catálogo</a>
        <a href="galeria.html">Galería</a>
        <a href="cotizar.html">Cotizar</a>
        <a href="contacto.html">Contacto</a>
        <a class="pill" href="pedido.html">Mi pedido (<span id="contadorPedido">0</span>)</a>
      </nav>
    </div>
  </header>
  <main id="contenido">
    <!-- Banner de la pagina: titulo con el estilo del rotulo y hojas decorativas (CSS) -->
    <section class="banner"><div class="contenedor"><h1 class="rotulo">Catálogo</h1><p>Agrega paquetes a tu pedido o escríbenos directo</p></div><svg class="ola" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C240 70 480 0 720 30 S1200 60 1440 20 V60 H0Z"/></svg></section>
    <!-- main.js dibuja las tarjetas en #listaProductos desde js/productos.js -->
    <section class="seccion">
      <div class="contenedor">
        <div class="filtros" id="filtros">
          <button class="filtro" data-cat="todos" aria-pressed="true">Todos</button>
          <button class="filtro" data-cat="cumpleaños" aria-pressed="false">Cumpleaños</button>
          <button class="filtro" data-cat="baby shower" aria-pressed="false">Baby shower</button>
          <button class="filtro" data-cat="temática" aria-pressed="false">Temáticas</button>
        </div>
        <div class="grid" id="listaProductos"></div>
        <p class="nota">
      </div>
    </section>
  </main>
  <footer class="footer">
    <img src="img/logo-principal.png" alt="" width="42" height="52">
    <p class="eslogan">¡Diversión Prehistórica!</p>
    <p>© <span id="anio"></span> DinoAventura Decoraciones. Bogotá, Colombia.</p>
  </footer>
  <a class="wa-flotante" data-wa target="_blank" rel="noopener" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M8.6 7.5c-.4 0-.8.2-1 .7-.4 1 .1 2.4 1.3 3.9 1.3 1.6 2.9 2.7 4.4 2.9.6.1 1.3-.4 1.5-1 .1-.3 0-.5-.2-.6l-1.3-.7c-.2-.1-.4 0-.5.1l-.5.6c-1-.4-1.9-1.3-2.4-2.3l.5-.5c.1-.1.2-.3.1-.5l-.7-1.4c-.1-.2-.3-.2-.5-.2z"/></svg></a>
  <!-- ORDEN de scripts: datos primero, luego la logica que los usa. -->
  <script src="js/config.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pedido.js"></script>
</body>
</html>
